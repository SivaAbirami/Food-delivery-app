# =============================================================================
# Swiggy Food Delivery — Core Infrastructure (MySQL + Redis)
#
# Services:
#   mysql:  Database 8.0 with auto-seeding on initial volume creation
#   redis:  In-memory cache for live telemetry & session caching
#
# Usage:
#   docker compose up -d
# =============================================================================

services:

  mysql:
    image: mysql:8.0
    container_name: food-delivery-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_delivery_db
      MYSQL_USER: food_user
      MYSQL_PASSWORD: food_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed_swiggy_db.sql:/docker-entrypoint-initdb.d/01_seed_swiggy_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - food-net

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - food-net

volumes:
  mysql_data:
    driver: local

networks:
  food-net:
    driver: bridge
