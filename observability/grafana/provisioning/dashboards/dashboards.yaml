apiVersion: 1

# =============================================================================
# Grafana Dashboard Provisioning
#
# Tells Grafana to load dashboard JSON files from the specified folder.
# Place dashboard .json files in: observability/grafana/provisioning/dashboards/
# =============================================================================

providers:
  - name: Food Delivery Dashboards
    orgId: 1
    # Folder name shown in the Grafana UI sidebar
    folder: "Food Delivery"
    type: file
    # Allow edits in UI (changes are not persisted back to file)
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      # Load dashboards from sub-folders too
      foldersFromFilesStructure: false
