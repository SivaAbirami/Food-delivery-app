# =============================================================================
# Mimir Configuration — Single-process mode (monolithic, ideal for local dev)
#
# Key design decisions:
#  - Single binary mode: all components run in one process
#  - Filesystem storage: no cloud object store needed locally
#  - No auth: single-tenant setup (org ID: "demo")
# =============================================================================

# Disable multi-tenancy (single tenant mode)
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

# All components share an in-memory ring (no external KV store)
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  bucket_store:
    # Sync interval for reading newly uploaded blocks
    sync_interval: 5m
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

# Ruler for alerting (uses Prometheus-compatible rule files)
ruler:
  enable_api: true
  rule_path: /data/mimir/ruler

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/rules

# Retention: 30 days
limits:
  compactor_blocks_retention_period: 30d
  # Ingestion limits — generous for local dev
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 500000

memberlist:
  join_members: []
